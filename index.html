<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CadenceRead</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="top">
      <h1>CadenceRead</h1>
      <span id="word-counter" class="badge" aria-live="polite">0 words</span>
    </header>
    <section class="stage" aria-label="RSVP Reader Stage">
      <div id="rsvp-word" class="word" aria-live="off">Ready</div>
    </section>
    <section id="controls-row" class="controls" aria-label="Reader Controls">
      <label for="wpm-select" class="ctrl-label">
        Speed:
        <select id="wpm-select">
          <option value="200">200 WPM</option>
          <option value="300" selected>300 WPM</option>
          <option value="450">450 WPM</option>
        </select>
      </label>
      <button id="play-btn" type="button" class="btn">Play</button>
    </section>
    <label for="draft-input" class="field-label">Passage to Read</label>
    <textarea id="draft-input" rows="4">Fast reading starts with calm focus. One word at a time removes eye strain and builds rhythm.</textarea>
  </main>
  <script src="./app.js"></script>
</body>
</html>
